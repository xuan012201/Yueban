<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>最烂网站建造器</title>
<style>:root{color-scheme:light}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&display=swap">

<style>
/* ══════════ 外壳：纸 · 墨 · 一点朱红 ══════════ */
:root{
  --paper:#f2efe6;
  --paper2:#e9e5d9;
  --card:#fffdf7;
  --ink:#14110e;
  --ink2:#4a453d;
  --dim:#8b857a;
  --line:#14110e;
  --red:#e8462a;
  --blue:#1f35c4;
  --ok:#1c7a4a;
  --ui:'Archivo',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sh:4px 4px 0 var(--ink);
  --sh2:3px 3px 0 var(--ink);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);
  font-size:14px;line-height:1.75;-webkit-font-smoothing:antialiased;
  overflow:hidden;
  display:grid;grid-template-columns:296px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);
  grid-template-areas:"bar bar" "side stage";
}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{border:0;background:none}
::selection{background:var(--red);color:#fff}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:var(--paper2)}
::-webkit-scrollbar-thumb{background:var(--ink);border:3px solid var(--paper2)}

/* ── 按钮 ── */
.btn{background:var(--card);color:var(--ink);padding:8px 15px;font-size:13.5px;font-weight:500;
  cursor:pointer;white-space:nowrap;border:2px solid var(--ink);box-shadow:var(--sh2);
  transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn.pri{background:var(--red);color:#fff}
.btn.ink{background:var(--ink);color:var(--paper)}
.btn.flat{box-shadow:none;border-width:2px}
.btn.flat:hover{transform:none;background:var(--paper2)}
.btn.danger{color:var(--red)}
.btn.big{padding:15px 32px;font-size:17px;font-weight:800;box-shadow:var(--sh)}
.btn:disabled{opacity:.35;cursor:default;box-shadow:none;transform:none}
.icb{width:34px;height:32px;background:var(--card);border:2px solid var(--ink);cursor:pointer;
  font-size:15px;box-shadow:2px 2px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.icb:hover:not(:disabled){transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.icb:disabled{opacity:.3;cursor:default;box-shadow:none}

/* ══════════ 首页 ══════════ */
.land{position:fixed;inset:0;z-index:150;overflow-y:auto;display:none;background:var(--paper)}
body.landing .land{display:block}
body.landing{overflow:hidden}
.lwrap{max-width:1000px;margin:0 auto;padding:56px 28px 70px}
.brandrow{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--red);margin-bottom:26px}
.brandrow::after{content:"";flex:1;height:2px;background:var(--ink)}
.land h1{margin:0;font-size:clamp(44px,8vw,86px);line-height:.98;font-weight:900;letter-spacing:-.03em}
.land h1 em{font-style:normal;color:var(--red)}
.tagline{margin:22px 0 0;font-size:19px;line-height:1.65;max-width:30em;color:var(--ink2)}
.startrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:34px 0 0}
.startnote{font-size:13px;color:var(--dim)}
.rule{height:2px;background:var(--ink);margin:52px 0 26px}
.exhead{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
.exhead b{font-size:15px;font-weight:800;letter-spacing:.04em}
.exhead span{font-size:13px;color:var(--dim)}
.exs{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.ex{background:var(--card);cursor:pointer;text-align:left;padding:0;display:block;width:100%;
  border:2px solid var(--ink);box-shadow:var(--sh);transition:transform .1s,box-shadow .1s}
.ex:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.ex:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.ex:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.shot{display:block;height:172px;overflow:hidden;position:relative;background:#fff;border-bottom:2px solid var(--ink)}
.shot .inn{position:absolute;left:0;top:0;transform-origin:top left}
.exm{display:block;padding:13px 15px 15px}
.exm b{display:block;font-size:15px;font-weight:800;margin-bottom:4px}
.exm span{display:block;font-size:12.5px;color:var(--ink2);line-height:1.65}

/* ══════════ 顶栏 ══════════ */
.bar{grid-area:bar;display:flex;align-items:center;gap:9px;padding:0 14px;background:var(--paper);
  border-bottom:2px solid var(--ink)}
.home{font-size:14px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;cursor:pointer;padding:7px 0;
  color:var(--ink);background:none;display:flex;align-items:center;gap:7px}
.home:hover{color:var(--red)}
.acts{display:flex;align-items:center;gap:7px;margin-left:auto}
.sepv{width:2px;height:22px;background:var(--ink);opacity:.25;margin:0 3px}

/* ══════════ 侧栏 ══════════ */
.side{grid-area:side;overflow-y:auto;background:var(--paper);border-right:2px solid var(--ink);padding-bottom:36px}
.sidetop{position:sticky;top:0;z-index:3;padding:12px;background:var(--paper);border-bottom:2px solid var(--ink)}
.seg{display:flex;gap:0;margin-bottom:10px;border:2px solid var(--ink)}
.seg button{flex:1;padding:7px;font-size:13px;font-weight:600;cursor:pointer;background:var(--card)}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}
.search{width:100%;background:var(--card);padding:8px 10px;font-size:13px;margin-bottom:9px;border:2px solid var(--ink)}
.search:focus{outline:none;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:4px 10px;font-size:12px;font-weight:500;cursor:pointer;background:var(--card);
  color:var(--ink);border:2px solid var(--ink)}
.chip:hover{background:var(--paper2)}
.chip.on{background:var(--ink);color:var(--paper)}
.grp{margin:20px 12px 9px;font-size:12px;font-weight:800;letter-spacing:.1em;
  display:flex;align-items:center;gap:9px;color:var(--ink)}
.grp::after{content:"";flex:1;height:2px;background:var(--ink)}
.grp em{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 12px}
.card{background:var(--card);cursor:pointer;text-align:left;padding:0;display:block;width:100%;
  border:2px solid var(--ink);transition:transform .08s,box-shadow .08s;box-shadow:2px 2px 0 var(--ink)}
.card:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.card:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.card:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.th{height:76px;background:#fff;overflow:hidden;position:relative;display:block;border-bottom:2px solid var(--ink)}
.th .in{position:absolute;left:50%;top:50%;transform-origin:center;border:0;box-shadow:none}
.th *{animation:none!important}
.th .hrt,.th .fall{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:5px;padding:6px}
.th .hrt i,.th .fall i{position:static!important;left:auto!important;top:auto!important}
.th .mq b{padding-left:6px!important}
.card .lbl{display:block;padding:7px 8px;font-size:12.5px;font-weight:500;line-height:1.3;text-align:center}
.lyr{display:flex;align-items:center;gap:8px;width:calc(100% - 24px);margin:5px 12px;padding:8px 11px;
  font-size:13px;text-align:left;cursor:pointer;background:var(--card);border:2px solid var(--ink)}
.lyr:hover{background:var(--paper2)}
.lyr.on{background:var(--ink);color:var(--paper)}
.lyr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lyr i{font-style:normal;font-size:11px;opacity:.6}
.tip{margin:14px 12px;padding:14px;font-size:13px;line-height:1.8;background:var(--card);border:2px solid var(--ink)}

/* ══════════ 舞台 ══════════ */
.stage{grid-area:stage;overflow:auto;padding:24px 24px 80px;display:flex;justify-content:center;
  align-items:flex-start;background:var(--paper2)}
.wrap{flex:none;width:964px}
.brow{background:var(--card);border:2px solid var(--ink);box-shadow:var(--sh)}
.btitle{display:flex;align-items:center;gap:9px;padding:7px 11px;font-size:12px;color:var(--ink2);
  border-bottom:2px solid var(--ink);background:var(--card)}
.btitle .ico{width:9px;height:9px;background:var(--red);flex:none}
.btitle .u{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11px}
.btitle .n{font-weight:600;font-size:11.5px}
.host{position:relative}
.canvas{position:relative;width:960px;height:1500px;background:#fff;overflow:hidden;transform-origin:top left}
.canvas.drop{outline:2px dashed var(--red);outline-offset:-4px}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;color:var(--dim);font-size:14px;text-align:center;padding:20px}
.empty b{font-weight:800;color:var(--ink);font-size:22px;margin-bottom:4px;letter-spacing:-.02em}
.empty .row{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap;justify-content:center}

.part{position:absolute;transform-origin:center}
.part>.inner{width:100%;height:100%;overflow:hidden}
body:not(.preview) .part{cursor:move}
body:not(.preview) .part:hover{outline:1px dashed var(--red)}
body:not(.preview) .part.sel{outline:2px solid var(--red)}
body:not(.preview) .part *{pointer-events:none}
body.preview .part a,body.preview .part [data-spawn]{cursor:pointer}
body.preview .part a:hover{filter:brightness(1.12)}
.rz,.rot{position:absolute;width:12px;height:12px;background:var(--red);border:2px solid var(--ink);
  display:none;z-index:9}
.rz{right:-7px;bottom:-7px;cursor:nwse-resize}
.rot{left:50%;top:-24px;margin-left:-7px;cursor:grab;border-radius:50%}
body:not(.preview) .part.sel .rz,body:not(.preview) .part.sel .rot{display:block;pointer-events:auto}
.part.sel::after{content:"";position:absolute;left:50%;top:-16px;width:2px;height:16px;background:var(--red)}
body.preview .part.sel::after{display:none}

.ftb{position:absolute;z-index:40;display:flex;align-items:center;gap:0;background:var(--card);
  border:2px solid var(--ink);box-shadow:var(--sh2);transform:translateX(-50%)}
.ftb button{padding:7px 12px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.ftb button+button{border-left:2px solid var(--ink)}
.ftb button:hover{background:var(--paper2)}
.ftb button.del:hover{background:var(--red);color:#fff}

/* ══════════ 弹窗 ══════════ */
.mask{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:22px;
  background:rgba(20,17,14,.55)}
.mask.on{display:flex}
.dlg{width:min(900px,100%);max-height:90vh;display:flex;flex-direction:column;background:var(--paper);
  border:2px solid var(--ink);box-shadow:8px 8px 0 rgba(20,17,14,.35)}
.dlg-s{width:min(460px,100%)}
.dlg header{padding:14px 18px;display:flex;align-items:center;gap:11px;flex:none;
  border-bottom:2px solid var(--ink);background:var(--card)}
.dlg header h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em}
.dlg header .sub{font-size:12.5px;color:var(--dim)}
.dlg header .sp{margin-left:auto}
.dbody{display:grid;grid-template-columns:352px minmax(0,1fr);min-height:0;flex:1}
.dprev{padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;border-right:2px solid var(--ink);
  background:var(--paper2)}
.pvstage{flex:1;min-height:230px;background:#fff;display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;border:2px solid var(--ink)}
.pvbox{transform-origin:center;flex:none}
.pvcap{font-size:12px;color:var(--dim);text-align:center}
.dopts{padding:18px;overflow-y:auto;min-height:0}
.askbody{padding:26px 22px;font-size:15px;line-height:1.85;background:var(--card)}
.dlg footer{padding:13px 18px;display:flex;gap:10px;justify-content:flex-end;align-items:center;flex:none;
  border-top:2px solid var(--ink);background:var(--card)}
.dlg footer .msg{margin-right:auto;font-size:12.5px;color:var(--dim)}
.dlg footer .msg b{color:var(--ink)}

.f{margin-bottom:15px}
.f>label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px}
.f .val{float:right;color:var(--dim);font-weight:400;font-family:var(--mono);font-size:11.5px}
.f input[type=text],.f textarea,.f select{width:100%;background:var(--card);padding:8px 10px;font-size:13.5px;
  border:2px solid var(--ink)}
.f textarea{resize:vertical;min-height:66px;line-height:1.7}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;background:#fff}
.f input[type=color]{width:100%;height:32px;background:var(--card);padding:2px;cursor:pointer;border:2px solid var(--ink)}
.f input[type=range]{width:100%;accent-color:var(--red)}
.ck{display:flex;align-items:center;gap:9px;font-size:13.5px;cursor:pointer;padding:6px 0;margin-bottom:4px}
.ck input{accent-color:var(--red);width:16px;height:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.numf{width:100%;background:var(--card);padding:7px;text-align:center;font-size:13px;
  font-family:var(--mono);border:2px solid var(--ink)}
.hint{font-size:12px;color:var(--dim);line-height:1.7;margin-top:6px}
.pick{display:flex;gap:9px;align-items:center}
.pick label.pk{background:var(--card);padding:8px 14px;font-size:12.5px;cursor:pointer;white-space:nowrap;
  border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.pick label.pk:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.pick input[type=file]{display:none}
.pick .st{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.divider{height:2px;background:var(--ink);margin:18px 0 16px;opacity:.2}
.lst{background:var(--card);padding:7px;margin-bottom:8px;border:2px solid var(--ink)}
.lrow{display:flex;gap:5px;align-items:center;margin-bottom:5px}
.lrow:last-child{margin-bottom:0}
.lrow input{flex:1;min-width:0;background:#fff;padding:6px 8px;font-size:13px;border:1.5px solid var(--ink)}
.lrow input:focus{outline:none;background:#fffbe8}
.mini{width:28px;height:28px;flex:none;font-size:12px;cursor:pointer;background:var(--paper);
  border:1.5px solid var(--ink)}
.mini:hover{background:var(--ink);color:var(--paper)}
.mini.x:hover{background:var(--red)}
.lempty{padding:9px 6px;font-size:12.5px;color:var(--dim)}
.addrow{padding:6px 13px;font-size:12.5px}
.rowbtns{display:flex;gap:7px;flex-wrap:wrap}
.tbe{background:var(--card);padding:7px;margin-bottom:8px;overflow-x:auto;border:2px solid var(--ink)}
.tbhead{display:flex;gap:5px;margin-bottom:6px}
.tbhead span{flex:1;min-width:68px;font-size:11.5px;font-weight:700;padding:0 2px}
.tbhead .op,.tbrow .op{flex:none;width:62px;display:flex;gap:5px}
.tbrow{display:flex;gap:5px;align-items:center;margin-bottom:5px}
.tbrow input{flex:1;min-width:68px;background:#fff;padding:6px;font-size:13px;border:1.5px solid var(--ink)}
.tbrow input:focus{outline:none;background:#fffbe8}
.notebox{background:#fff7d6;border:2px solid var(--ink);padding:11px 13px;font-size:12.5px;
  line-height:1.75;margin-bottom:14px}

/* ── 分享 / 鉴定 ── */
.shbody{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.picwait{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
  background:var(--card);font-size:15px;line-height:1.9;padding:30px}
.picbox{flex:1;overflow:auto;background:var(--paper2);padding:16px;text-align:center}
.picbox img{max-width:100%;border:2px solid var(--ink);box-shadow:var(--sh);background:#fff}
.code{width:100%;flex:1;min-height:280px;background:var(--card);margin:0;font-family:var(--mono);
  font-size:11.5px;line-height:1.6;padding:14px;resize:none;border:0;border-bottom:2px solid var(--ink)}
.code:focus{outline:none}
.tabs{display:flex;border:2px solid var(--ink)}
.tabs button{padding:5px 13px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--card)}
.tabs button+button{border-left:2px solid var(--ink)}
.tabs button.on{background:var(--ink);color:var(--paper)}

.scoreboard{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0;flex:1}
.scoreleft{border-right:2px solid var(--ink);background:var(--ink);color:var(--paper);
  padding:24px 22px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.bignum{font-size:96px;font-weight:900;line-height:.9;letter-spacing:-.05em;color:var(--red)}
.bignum small{font-size:22px;color:var(--paper);opacity:.5;font-weight:600}
.rankname{font-size:26px;font-weight:900;margin-top:14px;letter-spacing:-.01em}
.rankdesc{font-size:13.5px;line-height:1.8;opacity:.72;margin-top:10px}
.scoreright{padding:22px 24px;overflow-y:auto}
.crit{margin-bottom:14px}
.critrow{display:flex;align-items:baseline;gap:8px;font-size:13px;margin-bottom:5px}
.critrow b{font-weight:600}
.critrow span{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim)}
.mbar{height:13px;background:var(--paper2);border:2px solid var(--ink)}
.mbar i{display:block;height:100%;background:var(--red)}
.roast{margin-top:20px;padding:15px 17px;background:#fff7d6;border:2px solid var(--ink);
  font-size:15px;line-height:1.75;font-weight:600}
.sharebox{margin-top:16px;padding:14px 16px;background:var(--card);border:2px solid var(--ink)}
.sharebox p{margin:0 0 10px;font-size:13px;line-height:1.75;color:var(--ink2)}
.sharetext{width:100%;background:var(--paper2);border:2px solid var(--ink);padding:10px;font-size:13px;
  line-height:1.7;resize:vertical;min-height:72px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);opacity:0;
  z-index:200;padding:11px 18px;font-size:13.5px;font-weight:500;pointer-events:none;transition:.2s;
  background:var(--ink);color:var(--paper);border:2px solid var(--ink);max-width:76vw}
.toast.on{opacity:1;transform:translateX(-50%)}

body.preview{grid-template-columns:0 1fr}
body.preview .side,body.preview .hide,body.preview .ftb{display:none}
body.preview .stage{padding:0;background:#3a3733}
body.preview .brow{border:0;box-shadow:none}
body.preview .btitle{display:none}

@media (max-width:1180px){body{grid-template-columns:268px minmax(0,1fr)}}
@media (max-width:1000px){.exs{grid-template-columns:1fr}}

.mobibar{display:none}
.mobionly{display:none}
.drawerhead{display:none}
@media (max-width:900px){
  body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"bar" "stage"}
  .bar{flex-wrap:wrap;padding:8px;gap:6px}
  .acts{gap:5px;width:100%;margin-left:0;justify-content:flex-start;flex-wrap:wrap}
  .acts .btn{flex:1;min-width:0;padding:8px 5px;font-size:12.5px;text-align:center}
  .acts .icb{flex:none}
  .acts #pageset,.acts #chaos,.acts #share,.acts #prev{display:none}
  .mobionly{display:block}
  .sepv{display:none}
  .stage{padding:10px 8px 92px}
  .wrap{width:100%}
  .brow{box-shadow:2px 2px 0 var(--ink)}
  .host{overflow:hidden}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:90;height:76vh;border-right:0;
    border-top:2px solid var(--ink);box-shadow:0 -8px 24px rgba(0,0,0,.3);
    transform:translateY(100%);transition:transform .22s ease-out;display:block}
  body.drawer .side{transform:translateY(0)}
  .drawerhead{display:flex!important;align-items:center;gap:8px;padding:10px 12px;font-weight:800;font-size:14px;
    background:var(--ink);color:var(--paper);border-bottom:2px solid var(--ink)}
  .drawerhead .btn{margin-left:auto;padding:5px 13px;font-size:12.5px;box-shadow:none}
  .mobibar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:80;gap:7px;padding:9px;

const CW=960;
const PAGE0={bg:'#ffffff',pat:'bg-plain',pc:'#dddddd',bgimg:'',bgmode:'repeat',bgop:100,
  blink:false,cursor:'auto',h:1500,
  trail:'none',trailc:'#ff9ecb',fall:'none',fallc:'#ffb3dd',falln:14,falls:9};
let S={parts:[],seq:1,page:clone(PAGE0)};
let sel=null, preview=false;
const canvas=$('#canvas');
const CH=()=>S.page.h||1500;

let TT;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(TT);TT=setTimeout(()=>t.classList.remove('on'),2800)};
const save=()=>{try{localStorage.setItem('wsb.v3',JSON.stringify(S))}catch(e){toast('浏览器存储空间满了，这次没能自动保存（上传的图片或音乐太大）')}};
const load=()=>{try{const r=localStorage.getItem('wsb.v3');if(r){const o=JSON.parse(r);if(o&&o.parts)return o}}catch(e){}return null};

let HIST=[],HI=-1,RESTORE=false;
function pushHist(){
  if(RESTORE)return;
  const j=JSON.stringify(S);
  if(HI>=0&&HIST[HI]===j)return;
  HIST=HIST.slice(0,HI+1);HIST.push(j);
  if(HIST.length>60)HIST.shift();
  HI=HIST.length-1;histBtn();
}
const histBtn=()=>{$('#undo').disabled=HI<=0;$('#redo').disabled=HI>=HIST.length-1};
function jump(d){const i=HI+d;if(i<0||i>=HIST.length)return;
  HI=i;RESTORE=true;S=JSON.parse(HIST[i]);sel=null;render();RESTORE=false;histBtn()}

function place(type,props,x,y,w,h){
  const d=P[type];
  const p={id:S.seq++,type,x:Math.round(x??rnd(60,CW-d.w-60)),y:Math.round(y??rnd(60,600)),
    w:w||d.w,h:h||d.h,rot:0,z:S.seq,props:props?clone(props):clone(d.d)};
  S.parts.push(p);sel=p.id;render();return p;
}

/* ══════════ 渲染 ══════════ */
const partHTML=p=>`<div class="part${sel===p.id&&!preview?' sel':''}" data-id="${p.id}"
  style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;transform:rotate(${p.rot}deg);z-index:${p.z}">
  <div class="inner w">${P[p.type].r(p.props,p)}</div><div class="rot"></div><div class="rz"></div></div>`;

const TRAILCH={star:'✦',heart:'♥',dot:'●',snow:'❄',flower:'❀'};
function fallLayer(){
  const g=S.page;
  if(!g.fall||g.fall==='none')return '';
  const ch=TRAILCH[g.fall]||'❄', r=seeded(g.falln*13+7);
  let h=`<div class="fall" style="color:${g.fallc};--fh:${CH()+80}px">`;
  for(let i=0;i<g.falln;i++)h+=`<i style="left:${(r()*97).toFixed(1)}%;font-size:${(9+r()*15).toFixed(0)}px;
    animation-delay:-${(r()*g.falls).toFixed(2)}s;animation-duration:${(g.falls*(.7+r()*.7)).toFixed(1)}s">${ch}</i>`;
  return h+'</div>';
}
function pageLayers(){
  let h='';
  if(S.page.bgimg)h+=`<div style="position:absolute;inset:0;z-index:0;opacity:${S.page.bgop/100};
    background-image:url(${S.page.bgimg});background-repeat:${S.page.bgmode==='repeat'?'repeat':'no-repeat'};
    background-size:${S.page.bgmode==='cover'?'cover':S.page.bgmode==='stretch'?'100% 100%':'auto'};
    background-position:center"></div>`;
  if(S.page.pat!=='bg-plain')h+=`<div class="w ${S.page.pat}" style="position:absolute;inset:0;color:${S.page.pc};z-index:0"></div>`;
  h+=fallLayer();
  return h;
}
let QUIET=false;
function render(){
  if(QUIET)return;
  canvas.className='canvas'+(S.page.blink?' site-blink':'');
  canvas.style.cssText=`height:${CH()}px;background:${S.page.bg};cursor:${S.page.cursor}`;
  canvas.innerHTML=pageLayers()+S.parts.map(partHTML).join('')+
    (S.parts.length?'':`<div class="empty"><b>空白的一页</b>
      从左边挑部件往上放，越难看越好
      <span class="row"><button class="btn pri" data-e="chaos">随机乱塞一批</button>
      <button class="btn" data-e="popup">弹窗地狱</button>
      <button class="btn" data-e="glare">闪瞎眼主页</button>
      <button class="btn" data-e="form">反人类表单</button></span></div>`);
  $$('.empty [data-e]').forEach(b=>{b.style.pointerEvents='auto';
    b.addEventListener('click',()=>{const a=b.dataset.e;
      if(a==='chaos')return doChaos();
      loadSeed(a);});});
  $('#pcount').textContent=S.parts.length?S.parts.length+' 个部件':'';
  meter();layers();fitCanvas();save();pushHist();
}

function meter(){}

/* 浮动工具条 */
function floatBar(){
  const b=$('#ftb'), p=S.parts.find(x=>x.id===sel);
  if(!p||preview){b.hidden=true;return}
  b.hidden=false;
  b.innerHTML=`<button data-a="edit">编辑内容</button><div class="sp"></div>
    <button data-a="dup">复制</button><button data-a="front">上移</button><button data-a="back">下移</button>
    <div class="sp"></div><button data-a="del" style="color:#d7392b">删除</button>`;
  const above=p.y>52;
  b.style.left=(Math.max(90,Math.min(CW-90,p.x+p.w/2))*ZOOM)+'px';
  b.style.top=((above?p.y-44:p.y+p.h+10)*ZOOM)+'px';
  $$('#ftb button').forEach(x=>x.addEventListener('click',()=>{
    const a=x.dataset.a;
    if(a==='edit')return openPart(p.type,p.id);
    if(a==='del'){S.parts=S.parts.filter(y=>y.id!==p.id);sel=null}
    if(a==='front')p.z=++S.seq;
    if(a==='back')p.z=Math.min(...S.parts.map(y=>y.z))-1;
    if(a==='dup'){const c=clone(p);c.id=S.seq++;c.x+=24;c.y+=24;c.z=++S.seq;S.parts.push(c);sel=c.id}
    render();
  }));
}

/* ══════════ 侧栏 ══════════ */
let CATSEL='';
function thumb(d){
  let s=Math.min(138/d.w,72/d.h,1.5);
  if(d.h*s<13)s=Math.min(72/d.h,2.4);
  return `<span class="th"><span class="in" style="width:${d.w}px;height:${d.h}px;
    transform:translate(-50%,-50%) scale(${s.toFixed(3)})"><span class="w" style="display:block">${d.r(d.d,{w:d.w,h:d.h})}</span></span></span>`;
}
function buildLib(q=''){
  const k=(q===undefined?$('#search').value:q).trim().toLowerCase();
  const cats=CATSEL?[CATSEL]:CATS;
  let html=cats.map(c=>{
    const list=Object.values(P).filter(p=>p.cat===c&&(!k||p.n.toLowerCase().includes(k)||p.id.includes(k)||c.includes(k)));
    if(!list.length)return '';
    return `<div class="grp hbar ${CATCOL[c]||'c-navy'}">${c}${CATNOTE[c]&&!k?' <em>· '+CATNOTE[c]+'</em>':''}</div><div class="grid">`+
      list.map(p=>`<button class="card" data-t="${p.id}" title="${p.n}">${thumb(p)}<span class="lbl">${p.n}</span></button>`).join('')+`</div>`;
  }).join('');
  $('#libbody').innerHTML=html||`<div class="tip">没有找到相关部件。<br>试试「广告」「文字」「图片」「音乐」「蝴蝶」。</div>`;
  $$('.card').forEach(c=>c.addEventListener('click',()=>{openDrawer(false);openPart(c.dataset.t)}));
}
function buildChips(){
  $('#chips').innerHTML=[['','全部']].concat(CATS.map(c=>[c,c])).map(([v,t])=>
    `<button class="chip${CATSEL===v?' on':''}" data-c="${v}">${t}</button>`).join('');
  $$('#chips .chip').forEach(b=>b.addEventListener('click',()=>{
    CATSEL=b.dataset.c;buildChips();buildLib();$('.side').scrollTop=0;
  }));
}
function layers(){
  const ps=S.parts.slice().sort((a,b)=>b.z-a.z);
  $('#layerbody').innerHTML=ps.length
    ? `<div class="grp hbar c-navy">图层<span class="tail">上面的压住下面的</span></div>`+ps.map(p=>
      `<button class="lyr${p.id===sel?' on':''}" data-l="${p.id}"><span>${P[p.type].n}</span><i>#${p.id}</i></button>`).join('')
    : `<div class="tip">页面还是空的。<br>先去「部件库」里挑一个放上来。</div>`;
  $$('#layerbody .lyr').forEach(el=>el.addEventListener('click',()=>{
    sel=+el.dataset.l;syncSel();
    const n=canvas.querySelector(`.part[data-id="${sel}"]`);if(n)n.scrollIntoView({block:'center',behavior:'smooth'});
  }));
}
buildChips();buildLib();
$('#search').addEventListener('input',e=>buildLib(e.target.value));
$$('.seg button').forEach(t=>t.addEventListener('click',()=>{
  $$('.seg button').forEach(x=>x.classList.toggle('on',x===t));
  const lay=t.dataset.tab==='layer';
  $('#libbody').hidden=lay;$('#layerbody').hidden=!lay;
}));

/* ══════════ 画布交互 ══════════ */
let ZOOM=1,ZOOMFIT=true;
function fitCanvas(){
  const wrap=$('.wrap'),host=$('.host');if(!wrap||!host)return;
  const avail=wrap.clientWidth-(window.innerWidth<=900?10:12);
  ZOOM=ZOOMFIT?Math.min(1,Math.max(.24,avail/CW)):1;
  canvas.style.transform=ZOOM<1?`scale(${ZOOM})`:'';
  host.style.height=(CH()*ZOOM)+'px';
  host.style.width=ZOOM<1?(CW*ZOOM)+'px':'';
  floatBar();
}
addEventListener('resize',()=>{if(!document.body.classList.contains('landing'))fitCanvas()});

let drag=null;
function syncSel(){
  $$('.canvas .part').forEach(n=>n.classList.toggle('sel',+n.dataset.id===sel&&!preview));
  $$('#layerbody .lyr').forEach(n=>n.classList.toggle('on',+n.dataset.l===sel));
  floatBar();
}
const settle=()=>{meter();save();pushHist();floatBar()};
canvas.addEventListener('pointerdown',e=>{
  if(preview)return;
  const el=e.target.closest('.part');
  if(!el){if(sel!==null){sel=null;syncSel()}return}
  const p=S.parts.find(x=>x.id==el.dataset.id);if(!p)return;
  sel=p.id;
  const r=el.getBoundingClientRect();
  drag={p,el,mode:e.target.classList.contains('rz')?'size':e.target.classList.contains('rot')?'rot':'move',
    sx:e.clientX,sy:e.clientY,ox:p.x,oy:p.y,ow:p.w,oh:p.h,orot:p.rot,
    cx:r.left+r.width/2,cy:r.top+r.height/2,moved:false};
  if(drag.mode==='rot')drag.a0=Math.atan2(e.clientY-drag.cy,e.clientX-drag.cx)*180/Math.PI;
  el.setPointerCapture(e.pointerId);
  syncSel();$('#ftb').hidden=true;
});
canvas.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=(e.clientX-drag.sx)/ZOOM, dy=(e.clientY-drag.sy)/ZOOM;
  if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;
  if(drag.mode==='size'){
    drag.p.w=Math.max(26,Math.round(drag.ow+dx));drag.p.h=Math.max(16,Math.round(drag.oh+dy));
    drag.el.style.width=drag.p.w+'px';drag.el.style.height=drag.p.h+'px';
  }else if(drag.mode==='rot'){
    const a=Math.atan2(e.clientY-drag.cy,e.clientX-drag.cx)*180/Math.PI;
    let v=Math.round(drag.orot+(a-drag.a0));
    if(e.shiftKey)v=Math.round(v/15)*15;
    drag.p.rot=((v+180)%360+360)%360-180;
    drag.el.style.transform='rotate('+drag.p.rot+'deg)';
  }else{
    drag.p.x=Math.round(drag.ox+dx);drag.p.y=Math.round(drag.oy+dy);
    drag.el.style.left=drag.p.x+'px';drag.el.style.top=drag.p.y+'px';
  }
});
const endDrag=()=>{if(!drag)return;drag=null;settle()};
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('dblclick',e=>{
  if(preview)return;
  const el=e.target.closest('.part');if(!el)return;
  const p=S.parts.find(x=>x.id==el.dataset.id);if(p)openPart(p.type,p.id);
});
canvas.addEventListener('click',e=>{
  if(!preview)return;
  const a=e.target.closest('a');
  if(a){
    const href=a.getAttribute('href')||'';
    if(/^(#|javascript:)/i.test(href)){e.preventDefault();toast('这个链接还是空的 · 在部件设置里可以填上你自己的网址')}
    else return;
  }
  const s=e.target.closest('[data-spawn]');if(!s)return;
  const d=document.createElement('div');
  d.className='part';
  d.style.cssText=`left:${ri(40,CW-360)}px;top:${ri(40,Math.max(200,CH()-300))}px;width:330px;height:150px;z-index:9999`;
  d.innerHTML=`<div class="inner w">${P.error.r(Object.assign({},P.error.d,{msg:'发生错误 '+ri(1000,9999)}),{w:330,h:150})}</div>`;
  canvas.appendChild(d);
});

/* ══════════ 表单字段 ══════════ */
function field(f,v){
  const l=`<label>${f.l}${f.t==='range'?`<span class="val">${v}${f.unit||''}</span>`:''}</label>`;
  switch(f.t){
    case 'text':return `<div class="f">${l}<input type="text" data-k="${f.k}" value="${esc(v)}"></div>`;
    case 'area':return `<div class="f">${l}<textarea data-k="${f.k}">${esc(v)}</textarea></div>`;
    case 'color':return `<div class="f">${l}<input type="color" data-k="${f.k}" value="${esc(v)}"></div>`;
    case 'range':return `<div class="f">${l}<input type="range" data-k="${f.k}" min="${f.min}" max="${f.max}"
      step="${(f.max-f.min)<=12?0.5:1}" value="${esc(v)}"></div>`;
    case 'check':return `<label class="ck"><input type="checkbox" data-k="${f.k}"${v?' checked':''}>${f.l}</label>`;
    case 'sel':return `<div class="f">${l}<select data-k="${f.k}">${f.o.map((o,i)=>
      `<option value="${esc(o)}"${o===v?' selected':''}>${f.ol?f.ol[i]:o}</option>`).join('')}</select></div>`;
    case 'link':return `<div class="f">${l}<input type="text" data-k="${f.k}" value="${esc(v)}" placeholder="填写你自己的网址">
      <select data-preset="${f.k}" style="margin-top:7px"><option value="">或者挑一个无效链接</option>
      ${DEAD.map((d,i)=>`<option value="${esc(d)}">${esc(DEADL[i])}</option>`).join('')}</select></div>`;
    case 'file':return `<div class="f">${l}<div class="pick">
      <label class="pk">选择文件<input type="file" accept="${f.accept}" data-file="${f.k}"></label>
      <span class="st" data-st="${f.k}">${v?'已选好，可以插入了':'还没有选'}</span></div>
      ${f.note?`<div class="hint">${f.note}</div>`:''}</div>`;
    case 'note':return `<div class="notebox">${esc(f.text)}</div>`;
    case 'list':{
      const rows=String(v||'').split('\n').filter(x=>x!=='');
      return `<div class="f">${l}<div class="lst">`+
        (rows.length?rows.map((r,i)=>`<div class="lrow">
          <input type="text" data-li="${f.k}" data-i="${i}" value="${esc(r)}">
          <button class="mini" data-lmv="${f.k}" data-i="${i}" data-d="-1" title="上移">↑</button>
          <button class="mini" data-lmv="${f.k}" data-i="${i}" data-d="1" title="下移">↓</button>
          <button class="mini x" data-ldel="${f.k}" data-i="${i}" title="删除这一项">✕</button></div>`).join('')
          :`<div class="lempty">还没有内容</div>`)+
        `</div><button class="btn addrow" data-ladd="${f.k}">＋ 添加一项</button>
        ${f.note?`<div class="hint">${f.note}</div>`:''}</div>`;
    }
    case 'rows':{
      const rows=String(v||'').split('\n').filter(x=>x!=='').map(r=>r.split('|'));
      const nc=f.cols?f.cols.length:Math.max(1,...rows.map(r=>r.length));
      const head=f.cols?f.cols:Array.from({length:nc},(_,i)=>'第 '+(i+1)+' 列');
      return `<div class="f">${l}<div class="tbe">
        <div class="tbhead">${head.map(h=>`<span>${esc(h)}</span>`).join('')}<span class="op"></span></div>
        ${rows.length?rows.map((r,i)=>`<div class="tbrow">
          ${Array.from({length:nc},(_,c)=>`<input type="text" data-ri="${f.k}" data-i="${i}" data-c="${c}" value="${esc(r[c]||'')}">`).join('')}
          <span class="op"><button class="mini" data-lmv="${f.k}" data-i="${i}" data-d="-1" title="上移">↑</button>
          <button class="mini x" data-ldel="${f.k}" data-i="${i}" title="删除这一行">✕</button></span></div>`).join('')
          :`<div class="lempty">还没有内容</div>`}
        </div>
        <div class="rowbtns"><button class="btn addrow" data-radd="${f.k}" data-n="${nc}">＋ 添加一行</button>
        ${f.cols?'':`<button class="btn addrow" data-caddcol="${f.k}">＋ 加一列</button>
        <button class="btn addrow" data-cdelcol="${f.k}">－ 减一列</button>`}</div>
        ${f.note?`<div class="hint">${f.note}</div>`:''}</div>`;
    }
  }
  return '';
}
const LGET=k=>String(DL.props[k]||'').split('\n').filter(x=>x!=='');
const LSET=(k,a)=>{DL.props[k]=a.join('\n')};

/* ══════════ 部件弹窗 ══════════ */
let DL=null;
function renderOpts(){
  const d=P[DL.type], ex=DL.editId!=null;
  $('#dopts').innerHTML=d.f.map(f=>field(f,DL.props[f.k])).join('')+
    (ex?`<div class="divider"></div><div class="f"><label>宽 · 高 · 旋转</label><div class="grid3">
      <input class="numf" data-b="w" value="${DL.w}"><input class="numf" data-b="h" value="${DL.h}">
      <input class="numf" data-b="rot" value="${DL.rot}"></div></div>`:'');
  bindDialog();
}
function openPart(type,editId){
  const d=P[type], ex=editId!=null?S.parts.find(x=>x.id===editId):null;
  DL={type,editId:ex?editId:null,props:ex?clone(ex.props):clone(d.d),
      w:ex?ex.w:d.w,h:ex?ex.h:d.h,rot:ex?ex.rot:0};
  $('#mask').innerHTML=`
  <div class="dlg" role="dialog" aria-modal="true">
    <header><h3>${d.n}</h3><span class="sub">${ex?'修改这个部件':'调好之后再放到页面上'}</span>
      <span class="sp"></span><button class="btn ghost" data-x="1">关闭</button></header>
    <div class="dbody">
      <div class="dprev"><div class="pvstage" id="pvs"></div><div class="pvcap">示例效果（会随右边的设置实时变化）</div></div>
      <div class="dopts" id="dopts"></div>
    </div>
    <footer><span class="msg" id="dmsg">${ex?'':'放上去之后还可以拖动、缩放、旋转'}</span>
      <button class="btn" data-x="1">取消</button>
      <button class="btn pri" id="dok">${ex?'保存修改':'插入到页面'}</button></footer>
  </div>`;
  renderOpts();
  drawPreview();
  $('#mask').classList.add('on');
  const first=$('#dopts input[type=text],#dopts textarea');
  if(first)setTimeout(()=>first.focus(),40);
  $('#dok').addEventListener('click',()=>{
    if(DL.editId!=null){
      const p=S.parts.find(x=>x.id===DL.editId);
      p.props=clone(DL.props);p.w=DL.w;p.h=DL.h;p.rot=DL.rot;
    }else{
      place(DL.type,DL.props,undefined,undefined,DL.w,DL.h);
    }
    closeMask();render();
  });
}
function drawPreview(){
  const s=Math.min(1,312/DL.w,206/DL.h);
  $('#pvs').innerHTML=`<div class="pvbox" style="width:${DL.w}px;height:${DL.h}px;transform:scale(${s.toFixed(3)})">
    <div class="w">${P[DL.type].r(DL.props,DL)}</div></div>`;
}
function bindDialog(){
  $$('#dopts [data-k]').forEach(i=>i.addEventListener(i.type==='checkbox'||i.tagName==='SELECT'?'change':'input',()=>{
    DL.props[i.dataset.k]=i.type==='checkbox'?i.checked:i.value;
    const box=i.closest('.f'), v=box&&box.querySelector('.val');
    if(v&&i.type==='range'){const f=P[DL.type].f.find(x=>x.k===i.dataset.k);v.textContent=i.value+((f&&f.unit)||'')}
    drawPreview();
  }));
  $$('#dopts [data-preset]').forEach(s=>s.addEventListener('change',()=>{
    if(!s.value)return;
    const k=s.dataset.preset;DL.props[k]=s.value;
    const inp=$(`#dopts input[data-k="${k}"]`);if(inp)inp.value=s.value;
    s.value='';drawPreview();
  }));
  $$('#dopts [data-file]').forEach(i=>i.addEventListener('change',()=>{
    const file=i.files&&i.files[0];if(!file)return;
    const k=i.dataset.file, st=$(`#dopts [data-st="${k}"]`);
    st.textContent='正在读取…';
    const done=(src,w,h)=>{
      DL.props[k]=src;st.textContent='已选好，可以插入了';
      if(w&&h){const sc=Math.min(360/w,300/h,1.6);DL.w=Math.round(w*sc);DL.h=Math.round(h*sc);
        const bw=$('#dopts [data-b="w"]'),bh=$('#dopts [data-b="h"]');if(bw){bw.value=DL.w;bh.value=DL.h}}
      drawPreview();
    };
    if(i.accept.startsWith('audio'))readAudio(file,done,()=>st.textContent='读取失败');
    else readImage(file,done,()=>st.textContent='读取失败');
  }));
  $$('#dopts [data-b]').forEach(i=>i.addEventListener('input',()=>{
    const v=parseInt(i.value,10);if(isNaN(v))return;
    const k=i.dataset.b;DL[k]=(k==='rot')?v:Math.max(16,v);drawPreview();
  }));
  $$('#dopts [data-li]').forEach(i=>i.addEventListener('input',()=>{
    const k=i.dataset.li,a=LGET(k);a[+i.dataset.i]=i.value;LSET(k,a);drawPreview();
  }));
  $$('#dopts [data-ri]').forEach(i=>i.addEventListener('input',()=>{
    const k=i.dataset.ri,a=LGET(k).map(r=>r.split('|'));
    const r=+i.dataset.i,c=+i.dataset.c;
    while(a[r].length<=c)a[r].push('');
    a[r][c]=i.value.replace(/\|/g,'');
    LSET(k,a.map(x=>x.join('|')));drawPreview();
  }));
  $$('#dopts [data-ladd]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.ladd,a=LGET(k);a.push('新的一项');LSET(k,a);renderOpts();drawPreview();
    const ins=$$(`#dopts [data-li="${k}"]`);if(ins.length){const t=ins[ins.length-1];t.focus();t.select()}
  }));
  $$('#dopts [data-radd]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.radd,n=+b.dataset.n,a=LGET(k);
    a.push(Array.from({length:n},()=>'').join('|'));LSET(k,a);renderOpts();drawPreview();
    const ins=$$(`#dopts [data-ri="${k}"]`);if(ins.length){const t=ins[Math.max(0,ins.length-n)];t.focus()}
  }));

function readImage(file,cb,err){
  const r=new FileReader();
  r.onerror=()=>err&&err();
  if(file.type==='image/gif'){
    if(file.size>2.6e6){toast('这个 GIF 超过 2.6MB，浏览器存不下，换个小一点的');return err&&err()}
    r.onload=()=>{const im=new Image();im.onload=()=>cb(r.result,im.width,im.height);
      im.onerror=()=>err&&err();im.src=r.result};
    return r.readAsDataURL(file);
  }
  r.onload=()=>{const im=new Image();
    im.onerror=()=>{toast('这个文件读不出来，换一张试试');err&&err()};
    im.onload=()=>{
      const sc=Math.min(1,900/Math.max(im.width,im.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,im.width*sc|0);c.height=Math.max(1,im.height*sc|0);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      let out;try{out=c.toDataURL('image/webp',.82)}catch(e){out=c.toDataURL('image/png')}
      cb(out.length<200?r.result:out,c.width,c.height);
    };im.src=r.result};
  r.readAsDataURL(file);
}
function readAudio(file,cb,err){
  if(file.size>2.6e6){toast('音乐超过 2.6MB，浏览器存不下。可以先压缩成低码率 MP3 再上传。');return err&&err()}
  const r=new FileReader();
  r.onerror=()=>err&&err();
  r.onload=()=>cb(r.result);
  r.readAsDataURL(file);
}

addEventListener('keydown',e=>{

    if($('#mask').classList.contains('on'))return closeMask();

    return;
  }
  if($('#mask').classList.contains('on'))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/textarea|input/i.test(e.target.tagName)){jump(e.shiftKey?1:-1);e.preventDefault();return}
  if(/input|textarea|select/i.test(e.target.tagName))return;
  const p=S.parts.find(x=>x.id===sel);if(!p||preview)return;
  const st=e.shiftKey?10:1;
  if(e.key==='Delete'||e.key==='Backspace'){S.parts=S.parts.filter(x=>x.id!==p.id);sel=null;render();e.preventDefault()}
  else if(e.key==='Enter'){openPart(p.type,p.id);e.preventDefault()}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){
    const c=clone(p);c.id=S.seq++;c.x+=24;c.y+=24;c.z=++S.seq;S.parts.push(c);sel=c.id;render();e.preventDefault()}
  else if(e.key.startsWith('Arrow')){
    if(e.key==='ArrowLeft')p.x-=st; if(e.key==='ArrowRight')p.x+=st;
    if(e.key==='ArrowUp')p.y-=st; if(e.key==='ArrowDown')p.y+=st;
    const el=canvas.querySelector(`.part[data-id="${p.id}"]`);
    if(el){el.style.left=p.x+'px';el.style.top=p.y+'px'}
    settle();e.preventDefault()}
});

const ANIM=['blinktext','marquee','nyan','spin','fire','hr','winner','music','rainbow','audio',
  'glitter','sparkle','butterfly','hearts','holo','glowtext','chrometext','scanline'];
function hueOf(hex){
  const m=/^#?([0-9a-f]{6})$/i.exec(String(hex||''));if(!m)return null;
  const n=parseInt(m[1],16),r=(n>>16)/255,g=((n>>8)&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  if(d<.12)return null;
  let h;if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;
  return (h*60+360)%360;
}
function judge(){
  const ps=S.parts;
  const C={};
  /* 1 配色冲突 */
  const hues=[];
  ps.forEach(p=>Object.values(p.props).forEach(v=>{const h=hueOf(v);if(h!==null)hues.push(h)}));
  let clash=0;
  for(let i=0;i<hues.length;i++)for(let j=i+1;j<hues.length;j++){
    let d=Math.abs(hues[i]-hues[j]);if(d>180)d=360-d;
    if(d>110)clash++;
  }
  C['配色冲突']=Math.min(18,Math.round(Math.sqrt(clash)*2.1));
  /* 2 字体种类 */
  const fonts=new Set();ps.forEach(p=>{if(p.props.font)fonts.add(p.props.font)});
  C['字体种类']=Math.min(14,Math.max(0,(fonts.size-1))*3);
  /* 3 会动的东西 */
  const an=ps.filter(p=>ANIM.includes(p.type)).length+(S.page.blink?3:0)+
    (S.page.fall&&S.page.fall!=='none'?2:0)+(S.page.trail&&S.page.trail!=='none'?2:0);
  C['动个不停']=Math.min(16,an*2);
  /* 4 广告密度 */
  const ads=ps.filter(p=>P[p.type].cat==='广告弹窗').length;
  C['广告轰炸']=Math.min(16,ads*3.2);
  /* 5 排版错乱：重叠 + 旋转 + 出血 */
  let ov=0;for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const a=ps[i],b=ps[j];
    if(a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h)ov++}
  const rot=ps.filter(p=>p.rot).length, out=ps.filter(p=>p.x<0||p.y<0||p.x+p.w>CW).length;
  C['排版错乱']=Math.min(18,Math.round(ov*1.4+rot*1.6+out*2));
  /* 6 反人类阅读 */
  const tiny=ps.filter(p=>+p.props.size&&+p.props.size<11).length;
  const huge=ps.filter(p=>+p.props.size>=56).length;
  const hard=ps.filter(p=>['wall','mixfont','captcha','login','links'].includes(p.type)).length;
  C['难以阅读']=Math.min(18,tiny*3+huge*2+hard*3);
  let total=Object.values(C).reduce((a,b)=>a+b,0);
  if(ps.length<3)total=Math.min(total,Math.round(ps.length*8));
  total=Math.max(0,Math.min(100,Math.round(total)));
  /* 称号：按各项的「满格程度」挑，平手时偏向更少见的罪名 */
  const MAXV={'配色冲突':18,'字体种类':14,'动个不停':16,'广告轰炸':16,'排版错乱':18,'难以阅读':18};
  const PRIO=['广告轰炸','动个不停','排版错乱','难以阅读','字体种类','配色冲突'];
  const top=Object.entries(C).map(([k,v])=>[k,v,v/MAXV[k]])
    .sort((a,b)=>(b[2]-a[2])||(PRIO.indexOf(a[0])-PRIO.indexOf(b[0])))[0]||['',0];
  const TITLE={
    '配色冲突':['调色盘杀手','你把互补色当成了对比色。'],
    '字体种类':['字体收藏家','一页塞进这么多字体，是要开展览吗。'],
    '动个不停':['闪光弹专家','这一页没有一处是静止的。'],
    '广告轰炸':['弹窗刺客','关掉一个又冒出来两个。'],
    '排版错乱':['对齐失踪人口','没有一条边是对齐的，包括画布的边。'],
    '难以阅读':['视力测试出题人','读完这一页需要一副新眼镜。']};
  let rank,line;
  if(total<20){rank='良心未泯';line='还是太克制了，再放开一点。'}
  else if(total<40){rank='初级施工队';line='有点意思了，但还能更差。'}
  else if(total<60){rank='中级肇事者';line='已经开始让人不适了。'}
  else{const t=TITLE[top[0]]||['全能罪犯','每一项都很出色，非常糟糕。'];rank=t[0];line=t[1]}
  if(total>=88)line='这一页已经超出了「网页」的定义。';
  return {total,C,rank,line,parts:ps.length};
}

  {k:'popup',t:'弹窗地狱',d:'广告、报错、中奖横幅层层叠叠，关掉一个冒出两个。'},
  {k:'glare',t:'闪瞎眼主页',d:'高饱和撞色、七种字体、满屏在动，看三秒就想关。'},
  {k:'form',t:'反人类表单',d:'错位的输入框、看不清的验证码、永远走不完的进度条。'}
];
function buildLanding(){
  $('#exs').innerHTML=EXS.map(e=>{
    const st=makeSeed(e.k);
    return `<button class="ex" data-go="${e.k}">
      <span class="shot"><span class="inn" style="width:960px;height:${st.page.h}px;background:${st.page.bg};
        display:block;position:absolute">${stateHTML(st)}</span></span>
      <span class="exm"><b>${e.t}</b><span>${e.d}</span></span></button>`;
  }).join('');
  const sv=load();
  const has=!!(sv&&sv.parts&&sv.parts.length);
  $('#goresume').hidden=!has;
  if(has)$('#startnote').textContent='上次的作品还在';
  $$('[data-go]').forEach(b=>b.addEventListener('click',()=>enter(b.dataset.go)));
  fitShots();
}
$$('.ltab').forEach(t=>t.addEventListener('click',()=>{
  $$('.ltab').forEach(x=>x.classList.toggle('on',x===t));
  $$('.lsec').forEach(x=>x.hidden=x.dataset.lp!==t.dataset.lt);
}));
function fitShots(){
  $$('.shot').forEach(sh=>{const inn=sh.querySelector('.inn');
    if(inn)inn.style.transform=`scale(${(sh.clientWidth/960).toFixed(4)})`});
}
addEventListener('resize',()=>{if(document.body.classList.contains('landing'))fitShots()});
function enter(mode){
  if(mode==='resume'){const sv=load();if(sv){S=sv;S.page=Object.assign(clone(PAGE0),S.page||{})}}
  else if(mode==='blank'){S={parts:[],seq:1,page:clone(PAGE0)}}
  else{const st=makeSeed(mode);S={parts:st.parts,seq:st.seq,page:st.page}}
  document.body.classList.remove('landing');
  sel=null;HIST=[];HI=-1;render();bindTrail();histBtn();
  $('.stage').scrollTop=0;
  requestAnimationFrame(fitCanvas);
}
$('#home').addEventListener('click',()=>{
  document.body.classList.add('landing');
  if(preview)togglePreview();
  buildLanding();
});
document.body.classList.add('landing');
S={parts:[],seq:1,page:clone(PAGE0)};
buildLanding();
render();histBtn();
</script>

</body></html>
